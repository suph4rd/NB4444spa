name: nb4444-dev

services:
  mcp:
    profiles: ["mcp"]
    build:
      context: ../mcp_server
    image: nb4444-dev-mcp
    stdin_open: true
    environment:
      NB4444_API_URL: ${NB4444_API_URL:-http://nb4-api-dev:8008}
      NB4444_ACCESS_TOKEN: ${NB4444_ACCESS_TOKEN:-}
      NB4444_REFRESH_TOKEN: ${NB4444_REFRESH_TOKEN:-}
      NB4444_UPLOAD_ROOT: /uploads
      NB4444_HTTP_TIMEOUT: ${NB4444_HTTP_TIMEOUT:-30}
    volumes:
      - ${NB4444_UPLOAD_DIR:-../mcp_server/uploads}:/uploads:ro

  nb4_api_dev:
    build:
      context: ../NB4444
      dockerfile: Dockerfile
    image: 'nb4444-dev-api'
    networks:
      default:
        aliases:
          - nb4-api-dev
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8008"
    volumes:
      - ../NB4444/db:/NB4444/db
      - ../NB4444/media/foto:/NB4444/media/foto
    ports:
      - "8008:8008"

  nb4_vue_dev:
    build:
      context: ../nb4444-vue
      dockerfile: Dockerfile
    image: 'nb4444-dev-vue'
    command: sh -c "npm run serve -- --port 8080"
    ports:
      - "8080:8080"
