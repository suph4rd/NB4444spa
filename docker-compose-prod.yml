version: "3.3"


services:
  nb4_api_prod:
    build:
      context: ./NB4444
      dockerfile: prod.Dockerfile
    image: 'nb4444-prod-api'
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:9999"
    volumes:
      - ./NB4444/db:/NB4444/db
      - ./NB4444/media/foto:/NB4444/media/foto
    ports:
      - "9999:9999"
    restart: always

  nb4_vue_prod:
    build:
      context: ./nb4444-vue
      dockerfile: prod.Dockerfile
      args:
        VITE_API_PORT: ${VITE_API_PORT:-9999}
    image: 'nb4444-prod-vue'
    ports:
      - "90:80"
    restart: always
